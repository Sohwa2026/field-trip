<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소화초 체험학습 포털</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="text-slate-800">

  <!-- 상단 헤더 -->
  <header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <span class="inline-block bg-indigo-500 text-xs font-semibold px-2.5 py-1 rounded-full mb-1">교사 협업 데이터베이스</span>
        <h1 class="text-2xl font-bold tracking-tight">🏫 소화초등학교 체험학습 포털</h1>
        <p class="text-indigo-200 text-sm mt-1">수원 및 인근 권역 현장형·교내형 체험학습 정보를 공유합니다.</p>
      </div>
      <button onclick="openModal()" class="bg-white text-indigo-700 hover:bg-indigo-50 font-bold px-5 py-2.5 rounded-lg shadow transition flex items-center justify-center gap-2">
        <span>+ 새 장소/프로그램 추가</span>
      </button>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    
    <!-- 대분류 / 중분류 필터 & 검색창 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 space-y-4">
      
      <!-- 1단: 대분류 탭 + 검색창 -->
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-b border-slate-100 pb-4">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-slate-400 mr-1">운영 형태</span>
          <div class="inline-flex rounded-lg bg-slate-100 p-1" id="mainCategoryTabs">
            <button onclick="setMainCategory('전체')" class="main-cat-btn px-4 py-1.5 rounded-md text-sm font-bold bg-indigo-600 text-white shadow-sm transition">전체</button>
            <button onclick="setMainCategory('현장형')" class="main-cat-btn px-4 py-1.5 rounded-md text-sm font-bold text-slate-600 hover:text-slate-900 transition">🚌 현장형</button>
            <button onclick="setMainCategory('교내형')" class="main-cat-btn px-4 py-1.5 rounded-md text-sm font-bold text-slate-600 hover:text-slate-900 transition">🏫 교내형</button>
          </div>
        </div>

        <!-- 검색 입력 -->
        <div class="relative w-full lg:w-80">
          <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="장소명, 지역, 특징, 학년 검색..." 
            class="w-full pl-4 pr-10 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <span class="absolute right-3 top-2.5 text-slate-400 text-sm">🔍</span>
        </div>
      </div>

      <!-- 2단: 중분류 카테고리 버튼 -->
      <div class="flex flex-wrap items-center gap-2" id="subCategoryTabs">
        <span class="text-xs font-bold text-slate-400 mr-1">주제 분야</span>
        <button onclick="setSubCategory('전체')" class="sub-cat-btn px-3.5 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white">전체</button>
        <button onclick="setSubCategory('테마파크·스포츠')" class="sub-cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">테마파크·스포츠</button>
        <button onclick="setSubCategory('과학·환경·안전')" class="sub-cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">과학·환경·안전</button>
        <button onclick="setSubCategory('역사·문화·예술')" class="sub-cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">역사·문화·예술</button>
        <button onclick="setSubCategory('농촌·생태·자연')" class="sub-cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">농촌·생태·자연</button>
        <button onclick="setSubCategory('그 외 기타')" class="sub-cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">그 외 기타</button>
      </div>
    </div>

    <!-- 상태 표시줄 -->
    <div class="flex justify-between items-center mb-3 text-sm text-slate-500 px-1">
      <div>총 <strong id="totalCount" class="text-indigo-600">0</strong>개의 체험학습 정보가 등록되어 있습니다.</div>
      <div id="syncStatus" class="text-xs bg-slate-200 px-2.5 py-1 rounded">데이터 불러오는 중...</div>
    </div>

    <!-- 데이터 테이블 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-600 uppercase">
              <th class="py-3.5 px-4 w-36">분류 (대/중)</th>
              <th class="py-3.5 px-4 w-48">장소 / 프로그램명</th>
              <th class="py-3.5 px-4 w-36">위치 / 장소</th>
              <th class="py-3.5 px-4 w-28">추천 대상</th>
              <th class="py-3.5 px-4">주요 특징 및 단체 운영 포인트</th>
              <th class="py-3.5 px-4 w-36">최종 업데이트</th>
              <th class="py-3.5 px-4 w-28 text-center">관리</th>
            </tr>
          </thead>
          <tbody id="placeTableBody" class="divide-y divide-slate-100 text-sm">
            <!-- JS로 데이터 렌더링 -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 추가 / 수정 모달창 -->
  <div id="placeModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h2 id="modalTitle" class="text-lg font-bold text-slate-800">새 체험학습 등록</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      
      <form id="placeForm" onsubmit="savePlace(event)" class="space-y-4">
        <input type="hidden" id="editId" />
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">대분류 (운영 형태) *</label>
            <select id="inputMainCategory" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">
              <option value="현장형">🚌 현장형 (외부 이동)</option>
              <option value="교내형">🏫 교내형 (찾아오는 체험)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">중분류 (주제 분야) *</label>
            <select id="inputSubCategory" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">
              <option value="테마파크·스포츠">테마파크·스포츠</option>
              <option value="과학·환경·안전">과학·환경·안전</option>
              <option value="역사·문화·예술">역사·문화·예술</option>
              <option value="농촌·생태·자연">농촌·생태·자연</option>
              <option value="그 외 기타">그 외 기타</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">장소 / 프로그램명 *</label>
            <input type="text" id="inputName" required placeholder="예: 국립농업박물관" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">위치 (교내형은 업체/장소) *</label>
            <input type="text" id="inputLocation" required placeholder="예: 수원시 권선구 / 각 반 교실" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">추천 대상 *</label>
            <input type="text" id="inputTarget" required placeholder="예: 전 학년 / 중·고학년" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">작성자(수정자) 표기</label>
            <input type="text" id="inputEditor" placeholder="예: 3학년 김OO" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">주요 특징 및 단체 운영 포인트 *</label>
          <textarea id="inputFeatures" rows="3" required placeholder="버스 주차, 도시락 취식 공간, 교내 진행 시 필요 공간, 연락처 등을 적어주세요." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 bg-slate-100 rounded-lg hover:bg-slate-200">취소</button>
          <button type="submit" id="saveBtn" class="px-5 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // =========================================================================
    // [중요] 구글 Apps Script 웹 앱 URL을 아래 따옴표 안에 넣으세요!
    // =========================================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbwPKdxICnhu9faNvt8cG9e33--RqhoLGIeGeYaTktm6kPbfYSKnyPjG8oDuRWCno1LTBw/exec";

    const DEFAULT_PLACES = [
      { id: "1", category: "현장형 > 테마파크·스포츠", name: "한국민속촌", location: "용인시 기흥구", target: "전 학년", features: "조선 생활사 해설 투어, 전통 공예·음식 체험, 학교 단체 요금 및 안전 서류 완비", updatedAt: "2026-11-27 (기본등록)" }
    ];

    let places = [];
    let currentMainCategory = "전체";
    let currentSubCategory = "전체";
    const isGoogleConnected = API_URL.startsWith("https://script.google.com");

    // category 문자열("현장형 > 테마파크·스포츠")을 대분류와 중분류로 분리하는 도우미 함수
    function parseCategory(rawCat) {
      const str = String(rawCat || "");
      if (str.includes(">")) {
        const parts = str.split(">").map(s => s.trim());
        return { main: parts[0] || "현장형", sub: parts[1] || "테마파크·스포츠" };
      }
      return { main: "현장형", sub: str || "테마파크·스포츠" };
    }

    async function loadData() {
      const statusEl = document.getElementById("syncStatus");
      if (isGoogleConnected) {
        try {
          statusEl.textContent = "구글 시트 동기화 중...";
          const res = await fetch(API_URL);
          const data = await res.json();
          places = data.length === 0 ? [...DEFAULT_PLACES] : data;
          statusEl.textContent = "🟢 구글 시트 실시간 연동됨";
          statusEl.className = "text-xs bg-emerald-100 text-emerald-700 font-semibold px-2.5 py-1 rounded";
        } catch (err) {
          console.error(err);
          statusEl.textContent = "⚠️ 연동 오류 (로컬 모드 작동)";
          loadLocalData();
        }
      } else {
        statusEl.textContent = "🟡 로컬 테스트 모드 (구글 URL 미연결)";
        statusEl.className = "text-xs bg-amber-100 text-amber-800 font-semibold px-2.5 py-1 rounded";
        loadLocalData();
      }
      renderTable();
    }

    function loadLocalData() {
      const saved = localStorage.getItem("field_trip_places");
      places = saved ? JSON.parse(saved) : [...DEFAULT_PLACES];
    }

    // 대분류 선택
    function setMainCategory(mainCat) {
      currentMainCategory = mainCat;
      document.querySelectorAll(".main-cat-btn").forEach(btn => {
        const label = btn.textContent.replace("🚌 ", "").replace("🏫 ", "").trim();
        if (label === mainCat) {
          btn.className = "main-cat-btn px-4 py-1.5 rounded-md text-sm font-bold bg-indigo-600 text-white shadow-sm transition";
        } else {
          btn.className = "main-cat-btn px-4 py-1.5 rounded-md text-sm font-bold text-slate-600 hover:text-slate-900 transition";
        }
      });
      renderTable();
    }

    // 중분류 선택
    function setSubCategory(subCat) {
      currentSubCategory = subCat;
      document.querySelectorAll(".sub-cat-btn").forEach(btn => {
        if (btn.textContent.trim() === subCat) {
          btn.className = "sub-cat-btn px-3.5 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white";
        } else {
          btn.className = "sub-cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200";
        }
      });
      renderTable();
    }

    function getMainBadgeColor(main) {
      return main === "교내형" 
        ? "bg-purple-100 text-purple-700 border border-purple-200" 
        : "bg-indigo-50 text-indigo-700 border border-indigo-200";
    }

    function getSubBadgeColor(sub) {
      switch(sub) {
        case "테마파크·스포츠": return "bg-rose-100 text-rose-700";
        case "과학·환경·안전": return "bg-sky-100 text-sky-700";
        case "역사·문화·예술": return "bg-amber-100 text-amber-800";
        case "농촌·생태·자연": return "bg-emerald-100 text-emerald-700";
        case "그 외 기타": return "bg-violet-100 text-violet-700";
        default: return "bg-slate-100 text-slate-700";
      }
    }

    function renderTable() {
      const tbody = document.getElementById("placeTableBody");
      const keyword = document.getElementById("searchInput").value.toLowerCase();

      const filtered = places.filter(p => {
        const { main, sub } = parseCategory(p.category);
        const matchMain = currentMainCategory === "전체" || main === currentMainCategory;
        const matchSub = currentSubCategory === "전체" || sub === currentSubCategory;
        const matchSearch = 
          p.name.toLowerCase().includes(keyword) ||
          p.location.toLowerCase().includes(keyword) ||
          p.features.toLowerCase().includes(keyword) ||
          p.target.toLowerCase().includes(keyword);
        return matchMain && matchSub && matchSearch;
      });

      // 최신순 정렬
      filtered.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));

      document.getElementById("totalCount").textContent = filtered.length;
      tbody.innerHTML = "";

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10 text-slate-400">선택한 분류나 검색 조건에 맞는 체험학습 정보가 없습니다.</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        const { main, sub } = parseCategory(item.category);
        const formattedDate = String(item.updatedAt)
          .replace(' (', '<br><span class="text-slate-600 font-medium">(')
          .replace(')', ')</span>');

        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50 transition";
        tr.innerHTML = `
          <td class="py-3.5 px-4">
            <div class="flex flex-col items-start gap-1">
              <span class="inline-block px-2 py-0.5 rounded text-[11px] font-bold ${getMainBadgeColor(main)}">${main}</span>
              <span class="inline-block px-2.5 py-0.5 rounded-md text-xs font-bold ${getSubBadgeColor(sub)}">${sub}</span>
            </div>
          </td>
          <td class="py-3.5 px-4 font-bold text-slate-900">${item.name}</td>
          <td class="py-3.5 px-4 text-slate-600">${item.location}</td>
          <td class="py-3.5 px-4 text-slate-600 font-medium">${item.target}</td>
          <td class="py-3.5 px-4 text-slate-700 leading-relaxed">${item.features}</td>
          <td class="py-3.5 px-4 text-xs text-slate-400 leading-relaxed">${formattedDate}</td>
          <td class="py-3.5 px-4 text-center">
            <div class="flex justify-center gap-1.5">
              <button onclick="openModal('${item.id}')" class="px-2.5 py-1 text-xs font-semibold bg-slate-100 hover:bg-indigo-100 text-slate-700 hover:text-indigo-700 rounded">수정</button>
              <button onclick="deletePlace('${item.id}')" class="px-2.5 py-1 text-xs font-semibold bg-slate-100 hover:bg-rose-100 text-slate-700 hover:text-rose-700 rounded">삭제</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openModal(id = null) {
      const modal = document.getElementById("placeModal");
      const title = document.getElementById("modalTitle");
      
      if (id) {
        const target = places.find(p => String(p.id) === String(id));
        const { main, sub } = parseCategory(target.category);
        title.textContent = "체험학습 정보 수정";
        document.getElementById("editId").value = target.id;
        document.getElementById("inputMainCategory").value = main;
        document.getElementById("inputSubCategory").value = sub;
        document.getElementById("inputName").value = target.name;
        document.getElementById("inputLocation").value = target.location;
        document.getElementById("inputTarget").value = target.target;
        document.getElementById("inputFeatures").value = target.features;
        const matchEditor = String(target.updatedAt).match(/\(([^)]+)\)/);
        document.getElementById("inputEditor").value = matchEditor ? matchEditor[1] : "";
      } else {
        title.textContent = "새 체험학습 등록";
        document.getElementById("placeForm").reset();
        document.getElementById("editId").value = "";
        // 현재 필터로 선택해 둔 대분류/중분류가 있으면 기본값으로 자동 세팅
        if (currentMainCategory !== "전체") document.getElementById("inputMainCategory").value = currentMainCategory;
        if (currentSubCategory !== "전체") document.getElementById("inputSubCategory").value = currentSubCategory;
      }
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeModal() {
      const modal = document.getElementById("placeModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function getFormattedDate(editor) {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const author = editor.trim() ? ` (${editor.trim()})` : "";
      return `${yyyy}-${mm}-${dd} ${hh}:${min}${author}`;
    }

    async function savePlace(e) {
      e.preventDefault();
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "저장 중...";

      const id = document.getElementById("editId").value;
      const mainCat = document.getElementById("inputMainCategory").value;
      const subCat = document.getElementById("inputSubCategory").value;
      const category = `${mainCat} > ${subCat}`;
      const name = document.getElementById("inputName").value;
      const location = document.getElementById("inputLocation").value;
      const target = document.getElementById("inputTarget").value;
      const features = document.getElementById("inputFeatures").value;
      const editor = document.getElementById("inputEditor").value;
      const updatedAt = getFormattedDate(editor);

      if (id) {
        const idx = places.findIndex(p => String(p.id) === String(id));
        places[idx] = { id, category, name, location, target, features, updatedAt };
        if (isGoogleConnected) {
          await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "update", id, category, name, location, target, features, updatedAt })
          });
        }
      } else {
        const newId = String(Date.now());
        const newItem = { id: newId, category, name, location, target, features, updatedAt };
        places.unshift(newItem);
        if (isGoogleConnected) {
          await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "add", ...newItem })
          });
        }
      }

      if (!isGoogleConnected) {
        localStorage.setItem("field_trip_places", JSON.stringify(places));
      }

      saveBtn.disabled = false;
      saveBtn.textContent = "저장하기";
      closeModal();
      renderTable();
    }

    async function deletePlace(id) {
      if (!confirm("정말 이 체험학습 정보를 삭제하시겠습니까?")) return;
      places = places.filter(p => String(p.id) !== String(id));
      if (isGoogleConnected) {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "delete", id })
        });
      } else {
        localStorage.setItem("field_trip_places", JSON.stringify(places));
      }
      renderTable();
    }

    loadData();
  </script>
</body>
</html>
