<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>초등 현장체험학습 장소 공유 포털</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="text-slate-800">

  <!-- 상단 헤더 -->
  <header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <span class="inline-block bg-indigo-500 text-xs font-semibold px-2.5 py-1 rounded-full mb-1">교사 협업 데이터베이스</span>
        <h1 class="text-2xl font-bold tracking-tight">🏫 초등학교 현장체험학습 장소 포털</h1>
        <p class="text-indigo-200 text-sm mt-1">수원 및 인근 권역(80명 1개 학년 기준) 체험학습 정보를 함께 관리합니다.</p>
      </div>
      <button onclick="openModal()" class="bg-white text-indigo-700 hover:bg-indigo-50 font-bold px-5 py-2.5 rounded-lg shadow transition flex items-center justify-center gap-2">
        <span>+ 새 장소 추가하기</span>
      </button>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    
    <!-- 카테고리 탭 & 검색창 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
      <!-- 카테고리 버튼 -->
      <div class="flex flex-wrap gap-2" id="categoryTabs">
        <button onclick="setCategory('전체')" class="cat-btn active px-4 py-2 rounded-lg text-sm font-semibold bg-indigo-600 text-white">전체</button>
        <button onclick="setCategory('테마파크·스포츠')" class="cat-btn px-4 py-2 rounded-lg text-sm font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">테마파크·스포츠</button>
        <button onclick="setCategory('과학·환경·안전')" class="cat-btn px-4 py-2 rounded-lg text-sm font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">과학·환경·안전</button>
        <button onclick="setCategory('역사·문화·예술')" class="cat-btn px-4 py-2 rounded-lg text-sm font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">역사·문화·예술</button>
        <button onclick="setCategory('농촌·생태·자연')" class="cat-btn px-4 py-2 rounded-lg text-sm font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">농촌·생태·자연</button>
      </div>

      <!-- 검색 입력 -->
      <div class="relative w-full lg:w-80">
        <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="장소명, 지역, 특징, 학년 검색..." 
          class="w-full pl-4 pr-10 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <span class="absolute right-3 top-2.5 text-slate-400 text-sm">🔍</span>
      </div>
    </div>

    <!-- 상태 표시줄 -->
    <div class="flex justify-between items-center mb-3 text-sm text-slate-500 px-1">
      <div>총 <strong id="totalCount" class="text-indigo-600">0</strong>개의 체험학습 장소가 등록되어 있습니다.</div>
      <div id="syncStatus" class="text-xs bg-slate-200 px-2.5 py-1 rounded">데이터 불러오는 중...</div>
    </div>

    <!-- 데이터 테이블 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-600 uppercase">

              <th class="py-3.5 px-4 w-48">장소명</th>
              <th class="py-3.5 px-4 w-36">위치</th>
              <th class="py-3.5 px-4 w-28">추천 대상</th>
              <th class="py-3.5 px-4">주요 특징 및 단체 운영 포인트</th>
              <th class="py-3.5 px-4 w-36">최종 업데이트</th>
              <th class="py-3.5 px-4 w-28 text-center">관리</th>
            </tr>
          </thead>
          <tbody id="placeTableBody" class="divide-y divide-slate-100 text-sm">
            <!-- JS로 데이터 렌더링 -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 추가 / 수정 모달창 -->
  <div id="placeModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h2 id="modalTitle" class="text-lg font-bold text-slate-800">새 체험학습 장소 등록</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      
      <form id="placeForm" onsubmit="savePlace(event)" class="space-y-4">
        <input type="hidden" id="editId" />
        
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">카테고리 *</label>
          <select id="inputCategory" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">
            <option value="테마파크·스포츠">테마파크·스포츠</option>
            <option value="과학·환경·안전">과학·환경·안전</option>
            <option value="역사·문화·예술">역사·문화·예술</option>
            <option value="농촌·생태·자연">농촌·생태·자연</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">장소명 *</label>
            <input type="text" id="inputName" required placeholder="예: 국립농업박물관" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">위치 *</label>
            <input type="text" id="inputLocation" required placeholder="예: 수원시 권선구" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">추천 대상 *</label>
            <input type="text" id="inputTarget" required placeholder="예: 전 학년 / 중·고학년" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">작성자(수정자) 표기</label>
            <input type="text" id="inputEditor" placeholder="예: 3학년 김OO" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">주요 특징 및 단체 운영 포인트 *</label>
          <textarea id="inputFeatures" rows="3" required placeholder="버스 주차, 도시락 취식 공간, 예약 시기, 주요 체험 내용 등을 적어주세요." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 bg-slate-100 rounded-lg hover:bg-slate-200">취소</button>
          <button type="submit" id="saveBtn" class="px-5 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">저장하기</button>
        </div>
      </form>
    </div>

      { id: "30", category: "역사·문화·예술", name: "융건릉 및 용주사", location: "화성시 안녕동", target: "중·고학년", features: "정조의 효심과 조선 왕릉 세계유산 탐방, 숲길 산책 및 문화해설사 역사 수업 연계", updatedAt: "2026-11-27 (기본등록)" },
      { id: "31", category: "역사·문화·예술", name: "제암리3·1운동순국기념관", location: "화성시 향남읍", target: "고학년", features: "화성 지역 독립운동사 및 3·1운동 역사 학습, 독립운동 체험 교육 프로그램 운영", updatedAt: "2026-11-27 (기본등록)" },
      { id: "32", category: "역사·문화·예술", name: "오산독산성 및 세마대지", location: "오산시 지곶동", target: "중·고학년", features: "권율 장군의 세마대 일화와 산성 방어 체계 학습, 완만한 숲길 트레킹 및 역사 탐방", updatedAt: "2026-11-27 (기본등록)" },
      { id: "33", category: "농촌·생태·자연", name: "국립농업박물관", location: "수원시 권선구", target: "전 학년", features: "농업 역사, 스마트팜 기술, 어린이박물관, 야외 다랑이논 생태 체험, 80명 수용 최신 시설", updatedAt: "2026-11-27 (기본등록)" },
      { id: "34", category: "농촌·생태·자연", name: "용인농촌테마파크", location: "용인시 원삼면", target: "저·중학년", features: "농경문화전시관, 곤충체험관, 원예·공예 체험 및 넓은 잔디광장을 활용한 농촌 생태 체험", updatedAt: "2026-11-27 (기본등록)" },
      { id: "35", category: "농촌·생태·자연", name: "일월수목원", location: "수원시 장안구", target: "저·중학년", features: "전시온실 및 주제정원 중심 도심형 수목원, 보행로가 평탄하고 안전해 저학년 인솔에 적합", updatedAt: "2026-11-27 (기본등록)" },
      { id: "36", category: "농촌·생태·자연", name: "영흥수목원", location: "수원시 영통구", target: "저·중학년", features: "산지형 수목원 및 생태숲 해설 프로그램 운영, 계절별 숲 체험 및 자연물 공작 활동", updatedAt: "2026-11-27 (기본등록)" },
      { id: "37", category: "농촌·생태·자연", name: "서울대공원 (동물원·식물원)", location: "과천시 대공원광장로", target: "전 학년", features: "동물원 관람 및 동식물 생태 교육 프로그램 운영, 넓은 피크닉 광장에서 80명 단체 식사 편리", updatedAt: "2026-11-27 (기본등록)" },
      { id: "38", category: "농촌·생태·자연", name: "한택식물원", location: "용인시 처인구", target: "저·중학년", features: "국내 최대 민간 식물원, 계절 야생화 관찰·숲 해설·화분 심기 체험, 넓은 잔디광장 보유", updatedAt: "2026-11-27 (기본등록)" },
      { id: "39", category: "농촌·생태·자연", name: "화성시우리꽃식물원", location: "화성시 팔탄면", target: "저·중학년", features: "대형 유리온실(사계절관) 보유로 우천 시에도 식물 관찰 가능, 자생식물 생태 해설 운영", updatedAt: "2026-11-27 (기본등록)" },
      { id: "40", category: "농촌·생태·자연", name: "물향기수목원", location: "오산시 청학로", target: "저·중학년", features: "물과 나무 테마의 경기도립 수목원, 전철·버스 접근성 우수 및 평탄한 숲길 생태 탐방", updatedAt: "2026-11-27 (기본등록)" }
    ];

    let places = [];
    let currentCategory = "전체";
    const isGoogleConnected = API_URL.startsWith("https://script.google.com");

    // 초기 데이터 로드
    async function loadData() {
      const statusEl = document.getElementById("syncStatus");
      if (isGoogleConnected) {
        try {
          statusEl.textContent = "구글 시트 동기화 중...";
          const res = await fetch(API_URL);
          const data = await res.json();
          if (data.length === 0) {
            // 시트가 비어있으면 기본 40개 데이터를 시트에 자동 업로드
            places = [...DEFAULT_PLACES];
            await fetch(API_URL, {
              method: "POST",
              body: JSON.stringify({ action: "init", items: places })
            });
          } else {
            places = data;
          }
          statusEl.textContent = "🟢 구글 시트 실시간 연동됨";
          statusEl.className = "text-xs bg-emerald-100 text-emerald-700 font-semibold px-2.5 py-1 rounded";
        } catch (err) {
          console.error(err);
          statusEl.textContent = "⚠️ 연동 오류 (로컬 모드 작동)";
          loadLocalData();
        }
      } else {
        statusEl.textContent = "🟡 로컬 테스트 모드 (구글 URL 미연결)";
        statusEl.className = "text-xs bg-amber-100 text-amber-800 font-semibold px-2.5 py-1 rounded";
        loadLocalData();
      }
      renderTable();
    }

    function loadLocalData() {
      const saved = localStorage.getItem("field_trip_places");
      if (saved) {
        places = JSON.parse(saved);
      } else {
        places = [...DEFAULT_PLACES];
        localStorage.setItem("field_trip_places", JSON.stringify(places));
      }
    }

    // 카테고리 필터 변경
    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".cat-btn").forEach(btn => {
        if (btn.textContent === cat) {
          btn.className = "cat-btn active px-4 py-2 rounded-lg text-sm font-semibold bg-indigo-600 text-white";
        } else {
          btn.className = "cat-btn px-4 py-2 rounded-lg text-sm font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200";
        }
      });
      renderTable();
    }

    // 카테고리 배지 색상
    function getBadgeColor(cat) {
      switch(cat) {
        case "테마파크·스포츠": return "bg-rose-100 text-rose-700";
        case "과학·환경·안전": return "bg-sky-100 text-sky-700";
        case "역사·문화·예술": return "bg-amber-100 text-amber-800";
        case "농촌·생태·자연": return "bg-emerald-100 text-emerald-700";
        default: return "bg-slate-100 text-slate-700";
      }
    }

    // 테이블 렌더링
    function renderTable() {
      const tbody = document.getElementById("placeTableBody");
      const keyword = document.getElementById("searchInput").value.toLowerCase();

      const filtered = places.filter(p => {
        const matchCat = currentCategory === "전체" || p.category === currentCategory;
        const matchSearch = 
          p.name.toLowerCase().includes(keyword) ||
          p.location.toLowerCase().includes(keyword) ||
          p.features.toLowerCase().includes(keyword) ||
          p.target.toLowerCase().includes(keyword);
        return matchCat && matchSearch;
      });

      document.getElementById("totalCount").textContent = filtered.length;
      tbody.innerHTML = "";

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10 text-slate-400">검색 조건에 맞는 체험학습 장소가 없습니다.</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50 transition";
        tr.innerHTML = `
          <td class="py-3.5 px-4">
            <span class="inline-block px-2.5 py-1 rounded-md text-xs font-bold ${getBadgeColor(item.category)}">${item.category}</span>
          </td>
          <td class="py-3.5 px-4 font-bold text-slate-900">${item.name}</td>
          <td class="py-3.5 px-4 text-slate-600">${item.location}</td>
          <td class="py-3.5 px-4 text-slate-600 font-medium">${item.target}</td>
          <td class="py-3.5 px-4 text-slate-700 leading-relaxed">${item.features}</td>
          <td class="py-3.5 px-4 text-xs text-slate-400">${item.updatedAt}</td>
          <td class="py-3.5 px-4 text-center">
            <div class="flex justify-center gap-1.5">
              <button onclick="openModal('${item.id}')" class="px-2.5 py-1 text-xs font-semibold bg-slate-100 hover:bg-indigo-100 text-slate-700 hover:text-indigo-700 rounded">수정</button>
              <button onclick="deletePlace('${item.id}')" class="px-2.5 py-1 text-xs font-semibold bg-slate-100 hover:bg-rose-100 text-slate-700 hover:text-rose-700 rounded">삭제</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 모달 열기 (신규/수정)
    function openModal(id = null) {
      const modal = document.getElementById("placeModal");
      const title = document.getElementById("modalTitle");
      
      if (id) {
        const target = places.find(p => String(p.id) === String(id));
        title.textContent = "체험학습 장소 정보 수정";
        document.getElementById("editId").value = target.id;
        document.getElementById("inputCategory").value = target.category;
        document.getElementById("inputName").value = target.name;
        document.getElementById("inputLocation").value = target.location;
        document.getElementById("inputTarget").value = target.target;
        document.getElementById("inputFeatures").value = target.features;
        document.getElementById("inputEditor").value = "";
      } else {
        title.textContent = "새 체험학습 장소 등록";
        document.getElementById("placeForm").reset();
        document.getElementById("editId").value = "";
      }
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeModal() {
      const modal = document.getElementById("placeModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    // 현재 날짜/시간 포맷
    function getFormattedDate(editor) {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const author = editor.trim() ? ` (${editor.trim()})` : "";
      return `${yyyy}-${mm}-${dd} ${hh}:${min}${author}`;
    }

    // 저장 (추가 및 수정)
    async function savePlace(e) {
      e.preventDefault();
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "저장 중...";

      const id = document.getElementById("editId").value;
      const category = document.getElementById("inputCategory").value;
      const name = document.getElementById("inputName").value;
      const location = document.getElementById("inputLocation").value;
      const target = document.getElementById("inputTarget").value;
      const features = document.getElementById("inputFeatures").value;
      const editor = document.getElementById("inputEditor").value;
      const updatedAt = getFormattedDate(editor);

      if (id) {
        // 수정
        const idx = places.findIndex(p => String(p.id) === String(id));
        places[idx] = { id, category, name, location, target, features, updatedAt };
        if (isGoogleConnected) {
          await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "update", id, category, name, location, target, features, updatedAt })
          });
        }
      } else {
        // 추가
        const newId = String(Date.now());
        const newItem = { id: newId, category, name, location, target, features, updatedAt };
        places.unshift(newItem);
        if (isGoogleConnected) {
          await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "add", ...newItem })
          });
        }
      }

      if (!isGoogleConnected) {
        localStorage.setItem("field_trip_places", JSON.stringify(places));
      }

      saveBtn.disabled = false;
      saveBtn.textContent = "저장하기";
      closeModal();
      renderTable();
    }

    // 삭제
    async function deletePlace(id) {
      if (!confirm("정말 이 체험학습 장소를 삭제하시겠습니까?")) return;
      
      places = places.filter(p => String(p.id) !== String(id));
      if (isGoogleConnected) {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "delete", id })
        });
      } else {
        localStorage.setItem("field_trip_places", JSON.stringify(places));
      }
      renderTable();
    }

    // 실행
    loadData();
  </script>
